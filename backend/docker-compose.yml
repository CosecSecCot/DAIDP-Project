services:
  api:
    build: . # Build the image from the Dockerfile in the current directory
    container_name: daidp-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
    networks:
      - api-network

  db:
    image: postgres:16-alpine
    container_name: daidp-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/ # Persist database data
    env_file:
      - .env
    networks:
      - api-network

networks:
  api-network:
    driver: bridge

volumes:
  postgres_data: